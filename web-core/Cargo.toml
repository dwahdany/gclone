# gclone's read path for the hosted viewer (SPEC §7.5): keyfile, index objects, the merge rule,
# listing and search rules, per-file tickets, ranged chunk decryption. No I/O: JavaScript
# fetches bytes (Drive API) and hands them in. Built for wasm32-unknown-unknown (`build.sh`).
#
# The formats and the cryptography are not re-implemented here: `src/lib.rs` compiles the main
# crate's own source files a second time, by path. This crate has its own (empty) workspace and
# its own lockfile, so that the CLI's Cargo.toml, Cargo.lock and release build never see it.
# Every dependency below is one of the CLI's, at the CLI's version (`build.sh` checks the two
# lockfiles against each other); `wasm-bindgen` is pinned exactly, because the `wasm-bindgen`
# command line tool has to be the same version.
[package]
name = "gclone-web-core"
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
description = "The read path of gclone for the hosted viewer (WebAssembly)"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
# The unit tests inside the included files use the main crate's test helpers and vectors: they
# run there. This crate is tested by tests/parity.rs (native) and test/run.sh (wasm in Node).
test = false
doctest = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
thiserror = "2.0.21"
blake3 = "1.8.7"
base64 = "0.23"
# The `zeroize` features are the CLI's (its Cargo.toml says what each one wipes).
sha2 = { version = "0.11", features = ["zeroize"] }
getrandom = "0.4"
zeroize = "1.9"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
poly1305 = { version = "0.9.1", features = ["zeroize"] }
cipher = { version = "0.5.2", features = ["zeroize"] }
hkdf = "0.13.0"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
caseless = "0.2"
httpdate = "1"
unicode-normalization = "0.1.24"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "=0.2.130"
# Needed to compile `util::random` for this target. Nothing reachable from the exported API
# calls it (the viewer never seals anything), and LTO removes it: `build.sh` checks that the
# module imports nothing but wasm-bindgen's own intrinsics — no randomness, no clock.
getrandom = { version = "0.4", features = ["wasm_js"] }

# src/util.rs: host name and local time, on the targets that have them.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# src/error.rs names rusqlite::Error on every target that is not wasm (the native build of this
# crate, which exists for tests/parity.rs).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rusqlite = { version = "0.42", features = ["bundled", "fallible_uint"] }

# tests/parity.rs: this crate's reader against the SQL-backed replica of the CLI.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
gclone = { path = ".." }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros"] }
tempfile = "3.27"

[features]
# kdf_bench(): one Argon2id run with a fixed salt, for the device test page (design package P0).
bench = []
# wasm SIMD: build with RUSTFLAGS="-C target-feature=+simd128" --features simd (not shipped:
# no faster for Argon2id, and plain wasm runs everywhere).
simd = ["blake3/wasm32_simd"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# As in the CLI: dependencies are optimised in test builds too (Argon2id in tests/parity.rs).
[profile.dev.package."*"]
opt-level = 3
