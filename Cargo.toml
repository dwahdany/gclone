[package]
name = "gclone"
version = "0.6.1"
edition = "2024"
rust-version = "1.89"
description = "Client-side encrypted, rsync-style sync to Google Drive"
license = "MIT"
repository = "https://github.com/dwahdany/gclone"
publish = false

[lib]
name = "gclone"
path = "src/lib.rs"

[[bin]]
name = "gclone"
path = "src/main.rs"

# Nobody but WP0 edits this file (SPEC §9.1, §12). Every entry below resolves and compiles with
# cargo/rustc 1.99.0; the resolved versions are pinned by the committed Cargo.lock.
[dependencies]
# io-std: tokio::io::stdout() for `cat`
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "fs", "io-util", "io-std", "net", "sync", "time", "signal"] }
tokio-util = { version = "0.7.20", features = ["io", "rt"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
bytes = "1.12"
# rustls = rustls 0.23 + aws-lc-rs + platform verifier; `query` and `form` are opt-in in 0.13; no gzip
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "stream", "json", "query", "form"] }
# `gclone web`: the HTTP/1 server. Both are in the tree through reqwest; only the `server` half of hyper is new code
# http2: the stdio transport of `gclone serve restic`
hyper = { version = "1.12", default-features = false, features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
# fallible_uint: ToSql/FromSql for u64 (absent without it in 0.42)
rusqlite = { version = "0.42", features = ["bundled", "fallible_uint"] }
indicatif = "0.18.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "env-filter", "std"] }
ignore = "0.4.34"
anyhow = "1.0.104"
thiserror = "2.0.21"
rpassword = "7.5"
open = "5.4"
filetime = "0.2.29"
blake3 = "1.8.7"
etcetera = "0.11"
url = "2.5.8"
base64 = "0.23"
# zeroize: SHA-256 states — the HMAC and HKDF states keyed with master, purpose and passphrase
# keys are made of them — are wiped on drop (through digest/zeroize, which hmac and hkdf share)
sha2 = { version = "0.11", features = ["zeroize"] }
getrandom = "0.4"
zeroize = "1.9"
# 2026 RustCrypto generation (aead 0.6, digest 0.11): the versions must match as a set
# zeroize: the cipher object wipes its copy of the stream key (and the one-time MAC key) on drop
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
# Not used by name: these two are chacha20poly1305's own dependencies, listed to switch on
# their `zeroize` features, which chacha20poly1305's does not forward — the Poly1305 state
# (r and s of the one-time key) and the keystream buffer are then wiped on drop as well.
# Wiping stays best effort all the same (SPEC §4, §17.26): copies made by moves are not covered.
poly1305 = { version = "0.9.1", features = ["zeroize"] }
cipher = { version = "0.5.2", features = ["zeroize"] }
hkdf = "0.13.0"
# alloc: Argon2::hash_password_into allocates the working memory itself
# zeroize: Argon2 wipes its initial hash and block-hash buffers
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
md-5 = "0.11.0"
# Unicode full case folding for path::cmp_key (§5.1)
caseless = "0.2"
# `Date:` header parsing
httpdate = "1"
unicode-normalization = "0.1.24"
libc = "0.2"

# The Secure Enclave key store (src/keystore/macos.rs): declarations only. Both are in the tree
# already, through reqwest's platform certificate verifier, at these versions: Cargo.lock gains
# no package.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework-sys = "2.17.0"
core-foundation = "0.10.1"

[dev-dependencies]
wiremock = "0.6.5"
tempfile = "3.27"
tokio = { version = "1.54", features = ["test-util"] }
# The HTTP/2 client of the `serve restic` tests
hyper = { version = "1.12", default-features = false, features = ["client", "http2"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Dependencies are optimised in dev/test builds too: the keyfile KDF is Argon2id at 256 MiB (§2.6).
[profile.dev.package."*"]
opt-level = 3
