name: Release

# A tag v<version> builds the binaries and puts them into a DRAFT GitHub Release:
#   gclone-<target>.tar.gz (one file inside: gclone) for each target, and SHA256SUMS.
# install.sh installs from exactly these names. Each archive is signed with a build-provenance attestation in the
# job that built it; install.sh verifies it where the GitHub CLI is at hand (SHA256SUMS, made further down in this
# same run, only shows a damaged download), and the release job verifies it once more before anything is uploaded.
#
# This workflow does NOT publish. The release stays a draft - invisible to install.sh and to everybody without write
# access - until the owner runs scripts/release-sign-macos.sh <tag> on a Mac: that script verifies every asset of the
# draft against its attestation, adds gclone-aarch64-apple-darwin-signed.tar.gz (the attested macOS binary with a
# Developer ID signature, proven identical apart from the signature), extends SHA256SUMS, and publishes. The signing
# identity never leaves that Mac and no secret of it is known to GitHub (docs/SPEC.md §17.28, README "Publishing a release").
# Immutable releases must be switched on for the repository (Settings → General → Releases) BEFORE the tag is
# pushed: a published release then cannot have its files replaced. The script refuses to run where they are off.
#
# The release also carries the hosted viewer's files, gclone-viewer-<version>.tar.gz: what `wrangler deploy` uploads
# as the auth Worker's static assets (worker/README.md, "Deploying the viewer"). That bundle is the code a
# passphrase is typed into, so the job that builds it (viewer-bundle) runs no npm package and no third-party action,
# and signs the tarball with a build-provenance attestation. The attestation - not SHA256SUMS, which is made in this
# same workflow - is what worker/scripts/release-bundle.mjs verifies before anything is deployed.
#
# The auth Worker URL is compiled in from the repository variable GCLONE_DEFAULT_AUTH_URL
# (Settings → Secrets and variables → Actions → Variables). It is not a secret: it is readable
# in the binary and printed by `gclone --version`. Unset or empty = binaries without a built-in
# URL (`gclone login <AUTH_URL>`).
#
# Run by hand (workflow_dispatch) it builds and tests the same way and keeps the archives as
# workflow artifacts, without publishing anything (also when the run is started on a tag).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      # For the attestation of the archive (the last step but one).
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: static musl binaries, each built and tested natively.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag is the version in Cargo.toml
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says version $version"
            exit 1
          fi

      - name: Rust toolchain
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            # Every hosted image ships rustup today; this keeps the job alive if one stops.
            curl --proto '=https' --tlsv1.2 -fsS https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          # The version comes from rust-toolchain.toml: the compiler CI tested with.
          rustup toolchain install --no-self-update
          rustup target add "$TARGET"
          rustc --version
          cargo --version

      - name: musl C compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      # The test suite on the libc that ships (CI tests the glibc build). Not for the Intel
      # macOS build, which this runner cannot be relied on to execute.
      - name: Test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo test --locked --target "$TARGET"

      # profile.release strips the symbols (Cargo.toml: strip = "symbols").
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GCLONE_DEFAULT_AUTH_URL: ${{ vars.GCLONE_DEFAULT_AUTH_URL }}
        run: cargo build --release --locked --target "$TARGET"

      - name: Check and pack
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bin="target/$TARGET/release/gclone"
          file "$bin"
          case "$TARGET" in
            *-linux-musl)
              # Static: it must not ask for a dynamic loader or a shared libc.
              if file "$bin" | grep -q 'dynamically linked'; then
                echo "::error::$bin is dynamically linked"
                exit 1
              fi
              ;;
          esac
          if [ "$TARGET" != "x86_64-apple-darwin" ]; then
            "$bin" --version
            "$bin" --version | grep -F "($TARGET, "
          fi
          mkdir dist
          tar -czf "dist/gclone-$TARGET.tar.gz" -C "target/$TARGET/release" gclone
          ls -l dist

      # Signed by GitHub for this repository, this workflow file, this ref and this commit - here, in the job that
      # built the bytes, before they become an artifact that other jobs of the run can reach. Stored outside the
      # release's files: `gh attestation verify gclone-<target>.tar.gz --repo … --signer-workflow …/release.yml
      # --source-ref refs/tags/<tag>` (install.sh does that).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/gclone-${{ matrix.target }}.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gclone-${{ matrix.target }}
          path: dist/gclone-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  # The canonical bundle of the hosted viewer, and nothing else. Every step is listed in docs/SPEC.md §7.5: the pinned
  # Rust toolchain, wasm-bindgen built from source in the lockfile's version, the two build scripts, the check, the
  # pack, the attestation. NO `npm ci`, no wrangler, no browser, no action beyond checkout, the attestation and the
  # upload: no install script of an npm package ever runs in the workspace that produces these bytes.
  viewer-bundle:
    name: viewer bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.pack.outputs.version }}
      build: ${{ steps.pack.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag is the version in Cargo.toml and in web-core/Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          core=$(sed -n 's/^version = "\(.*\)"$/\1/p' web-core/Cargo.toml | head -n 1)
          if [ "$version" != "$core" ]; then
            echo "::error::Cargo.toml says version $version, web-core/Cargo.toml says $core"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says version $version"
            exit 1
          fi

      - name: Rust toolchain with the wasm target
        shell: bash
        run: |
          # The version comes from rust-toolchain.toml: the compiler CI tested with.
          rustup toolchain install --no-self-update
          rustup target add wasm32-unknown-unknown
          rustc --version
          cargo --version
          node --version

      - name: wasm-bindgen, the version of the crate in web-core/Cargo.lock
        run: sh .github/scripts/install-wasm-bindgen.sh

      - name: Build the wasm module
        run: sh web-core/build.sh

      # Node's built-in modules only (the runner's own Node). The manifest says which tag and commit this is.
      - name: Build the bundle
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then export GCLONE_VIEWER_TAG="$GITHUB_REF_NAME"; else export GCLONE_VIEWER_TAG=""; fi
          GCLONE_VIEWER_COMMIT="$GITHUB_SHA" node worker/viewer/build.mjs

      - name: Check the bundle
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            node worker/scripts/check-dist.mjs worker/dist --release "$GITHUB_REF_NAME"
          else
            node worker/scripts/check-dist.mjs worker/dist
          fi

      - name: Pack
        id: pack
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          build=$(ls worker/dist/a)
          mkdir out
          # The same bytes for the same tree: sorted names, no owner, one time stamp, no gzip header fields.
          # ustar: plain headers only, which is all worker/scripts/release-bundle.mjs unpacks.
          tar --format=ustar --sort=name --owner=0 --group=0 --numeric-owner --mode='u=rwX,go=rX' \
              --mtime='UTC 2020-01-01' -cf - -C worker/dist _headers a index.html sw.js \
            | gzip -n > "out/gclone-viewer-$version.tar.gz"
          tar -tzvf "out/gclone-viewer-$version.tar.gz"
          sha256sum "out/gclone-viewer-$version.tar.gz"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          {
            echo "### Viewer bundle"
            echo "\`gclone-viewer-$version.tar.gz\`, build \`$build\`"
            echo '```'
            cat "worker/dist/a/$build/manifest.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Signed by GitHub for this repository, this workflow file, this ref and this commit; stored outside the
      # release's files. `gh attestation verify … --signer-workflow …/release.yml --source-ref refs/tags/<tag>`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/gclone-viewer-${{ steps.pack.outputs.version }}.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gclone-viewer
          path: out/gclone-viewer-${{ steps.pack.outputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Exactly those bytes, served by the Worker under local workerd and driven in three browsers, before they are
  # published. macOS: see the note at the browser job of ci.yml.
  viewer-test:
    name: viewer bundle in Chrome, WebKit and Firefox
    needs: viewer-bundle
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      GCLONE_VIEWER_DIST: ${{ github.workspace }}/worker/dist
      GCLONE_BIN: ${{ github.workspace }}/target/release/gclone
      GCLONE_PLAYWRIGHT_CORE: ${{ github.workspace }}/worker/test/e2e/node_modules/playwright-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gclone-viewer
          path: ${{ runner.temp }}/viewer
      - name: Unpack the bundle into worker/dist
        shell: bash
        env:
          VERSION: ${{ needs.viewer-bundle.outputs.version }}
        run: |
          mkdir worker/dist
          tar -xzf "$RUNNER_TEMP/viewer/gclone-viewer-$VERSION.tar.gz" -C worker/dist
          node worker/scripts/check-dist.mjs worker/dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            worker/package-lock.json
            worker/test/e2e/package-lock.json
      - run: npm ci
        working-directory: worker
      # The Worker and the asset layer on these files: routing, headers, and every file served byte for byte.
      - run: npm run smoke
        working-directory: worker
      - name: Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustc --version
      # The native binary writes the fixture vault.
      - run: cargo build --release --locked
      - name: Playwright (the driver only, pinned by worker/test/e2e/package-lock.json), its WebKit and Firefox
        working-directory: worker/test/e2e
        run: |
          npm ci --ignore-scripts
          node node_modules/playwright-core/cli.js install webkit firefox
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version
      - name: The large media fixture
        run: |
          brew install ffmpeg
          sh worker/test/e2e/fixtures/make-big.sh "$RUNNER_TEMP/big.mp4"
      - name: The viewer end to end
        env:
          GCLONE_E2E_BIG: ${{ runner.temp }}/big.mp4
        run: node worker/test/e2e/run.mjs chrome webkit firefox
      - name: The sign-in through the Worker's own code
        run: node worker/test/e2e/signin.mjs

  release:
    name: draft release
    # Only the push of a tag makes a release; a run by hand never does, also not with a tag as its ref.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, viewer-bundle, viewer-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # To read the attestations that the build jobs made.
      attestations: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: gclone-*
          merge-multiple: true
      # The archives were workflow artifacts on their way here, and other jobs of this run ran npm install scripts and
      # a package manager. Each one goes into the release only if it is, byte for byte, what its build job attested:
      # built by this workflow, on this tag, from this commit.
      - name: Every archive is what its build job attested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for archive in dist/gclone-*.tar.gz; do
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
      # The pattern above also takes the viewer bundle (artifact gclone-viewer): it is one more gclone-*.tar.gz.
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum gclone-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      # A DRAFT, and the job stops there: nothing is public yet, and install.sh does not see a draft. The owner's
      # scripts/release-sign-macos.sh verifies the draft, adds the signed macOS archive and publishes (see the head of
      # this file). The notes name the viewer's build id, which the viewer's info panel shows; SHA256SUMS is a
      # convenience for it, the attestation is what the deploy verifies. The first line of the notes is replaced when
      # the release is published.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VIEWER_VERSION: ${{ needs.viewer-bundle.outputs.version }}
          VIEWER_BUILD: ${{ needs.viewer-bundle.outputs.build }}
        run: |
          test -f "dist/gclone-viewer-$VIEWER_VERSION.tar.gz"
          draft="DRAFT until signed: this release is not published yet. \`scripts/release-sign-macos.sh $GITHUB_REF_NAME\` on the owner's Mac verifies these files, adds the signed macOS archive and publishes."
          viewer="Hosted viewer: \`gclone-viewer-$VIEWER_VERSION.tar.gz\`, build \`$VIEWER_BUILD\`. Deploy it with \`node scripts/fetch-viewer.mjs $GITHUB_REF_NAME\` in \`worker/\`, which verifies its build-provenance attestation (worker/README.md)."
          notes=$(printf '%s\n\n%s\n' "$draft" "$viewer")
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes "$notes" --generate-notes dist/gclone-*.tar.gz dist/SHA256SUMS
          {
            echo "### Draft release $GITHUB_REF_NAME"
            echo "Not published. On the owner's Mac: \`scripts/release-sign-macos.sh $GITHUB_REF_NAME\`"
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
